name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Opsæt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Byg projektet (uden tests)
        run: mvn -B -DskipTests package

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    # Tests kører kun ved pull requests til main
    if: github.event_name == 'pull_request'
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Opsæt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Kør unittests og integrationstests
        run: mvn -B verify

      - name: Gem testrapporter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testrapporter
          path: target/surefire-reports/
          if-no-files-found: ignore
